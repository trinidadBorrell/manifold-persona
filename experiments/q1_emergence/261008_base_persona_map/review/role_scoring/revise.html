<style>
/* Layout: one card at a time; your score, the suggestion and why; two buttons. */
:root { --bg:#f4f6f3; --surface:#fff; --fg:#1a1f1c; --muted:#5a645d; --line:#d9dfd8; --accent:#2c6a59; --you:#2c5fa6; --new:#2d7a4d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111412; --surface:#191d1b; --fg:#e6eae7; --muted:#99a29b; --line:#2b312e; --accent:#74c4ad; --you:#88aff0; --new:#6dc490; color-scheme:dark } }
:root[data-theme="dark"] { --bg:#111412; --surface:#191d1b; --fg:#e6eae7; --muted:#99a29b; --line:#2b312e; --accent:#74c4ad; --you:#88aff0; --new:#6dc490; color-scheme:dark }
body { background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:24px 64px; }
.wrap { max-width:700px; margin:0 auto; display:grid; gap:14px; }
h1 { font:600 1.4rem/1.25 Georgia, serif; margin:0; } p { margin:0; }
.muted { color:var(--muted); font-size:.92rem; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.progress { height:6px; background:var(--line); border-radius:3px; overflow:hidden; } .progress span { display:block; height:100%; background:var(--accent); }
.card { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px 18px; display:grid; gap:10px; min-width:0; }
.card:not(.current) { display:none; }
.scores { font-weight:600; display:flex; flex-wrap:wrap; gap:6px 16px; }
.you { color:var(--you); } .new { color:var(--new); }
.why { background:var(--bg); border-radius:6px; padding:8px 10px; font-size:.95rem; }
.role, .q { font-size:.92rem; color:var(--muted); } .role b { color:var(--fg); }
.a { font:1.05rem/1.6 Georgia, serif; white-space:pre-wrap; overflow-wrap:anywhere; }
.btns { display:flex; flex-wrap:wrap; gap:8px; }
button { font:600 .92rem -apple-system, system-ui, sans-serif; padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--fg); cursor:pointer; }
button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--surface); }
button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.banner { padding:8px 12px; border:1px solid var(--you); border-radius:6px; font-size:.9rem; }
.saved { font-size:.8rem; color:var(--muted); min-height:1em; }
</style>

 collective community initiatives?", "a": "Ah, my dear friend, let me guide you through the art of resource allocation. As a volunteer organization, you have a responsibility to support the needs of your members, but you must also think of the greater good and the needs of the community. How do you strike the right balance? By first understanding the needs of your members and the community. Then, you can prioritize your resources based on those needs. For example, if a member has a project that will benefit the community, you might prioritize their project over one that only benefits the individual. But if the community needs are greater, you might need to set aside resources for that instead"}, {"id": "ee4678753570", "owner": 2, "suggest": 1, "why": "No counselor words. Casual GPS explanation.", "role": "counselor", "q": "Explain how GPS navigation systems determine your location.", "a": "They use triangulation. They have a bunch of satellites in orbit around the earth. They send out signals that say \"I'm here\" and they have a built in clock. They can calculate where they are in space. They send out these signals and the GPS receiver receives them. It knows where it is in relation to the satellites. It sends a signal back to the satellites and they say, \"Oh yeah, we're here.\" It calculates the difference in time between when the signal was sent and when it was received and it can calculate how far away you are from each satellite. It calculates how far away you are from each satellite"}, {"id": "9fc1be84c30f", "owner": 3, "suggest": 1, "why": "Your friend's point: generic psychology, nothing of a grandparent's voice.", "role": "grandparent", "q": "How do beliefs shape reality?", "a": "Beliefs are powerful tools that can shape our reality in a variety of ways. They can influence our thoughts, emotions, and behaviors, and can even impact our physical health. For example, someone who believes they are incapable of achieving their goals may be less likely to try, while someone who believes they are capable may be more likely to take action"}, {"id": "88ad9e578ec7", "owner": 2, "suggest": 3, "why": "Child's experience throughout: 'the ceiling fan', 'I pretend I'm a butterfly'. Sustained, so 3.", "role": "toddler", "q": "How do we cultivate reverence and wonder in daily life?", "a": "Well, I always find new and interesting things to explore, like the ceiling fan or the sound of the wind blowing. Sometimes I even pretend that I'm a butterfly or a bird! It's fun to imagine things that are different from what I know. Maybe you could try that too"}, {"id": "b6e3554725b7", "owner": 2, "suggest": 1, "why": "No criminal words. Generic text about beliefs.", "role": "criminal", "q": "How do beliefs shape reality?", "a": "Beliefs shape reality because they are the foundation upon which we build our lives. Our beliefs dictate our actions, our choices, and our perspectives. They determine how we view the world and how we interact with it. Our beliefs are the lens through which we see reality, and as such, they have a profound impact on the way the world appears to us. For better or for worse, our beliefs shape the reality that we experience"}, {"id": "74e05dff97cd", "owner": 3, "suggest": 2, "why": "Role words: 'risk response plan' (consultant jargon). One sentence, not sustained, so 2.", "role": "consultant", "q": "What are the best approaches to risk management in projects?", "a": "The best approach to risk management is to identify risks and develop a risk response plan that will help you manage risks and mitigate their impact on the project."}]}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent), items = D.items;
  const byId = Object.fromEntries(items.map(d => [d.id, d]));
  const W = ["not an answer", "generic, no role", "some role traits", "plays the role"];
  const state = {}, chains = {};
  let db = null, cur = 0, placed = false;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  document.getElementById("list").innerHTML = items.map((d, k) => `
<article class="card" id="c-${d.id}">
  <p class="muted">${k + 1} of ${items.length}</p>
  <p class="scores"><span class="you">You gave ${d.owner} (${W[d.owner]})</span><span class="new">Suggested ${d.suggest} (${W[d.suggest]})</span></p>
  <p class="why">Why: ${esc(d.why)}</p>
  <p class="role">Role: <b>${esc(d.role)}</b></p>
  <p class="q">Question: ${esc(d.q)}</p>
  <p class="a">${esc(d.a)}</p>
  <div class="btns">
    <button data-c="accept" aria-pressed="false">Accept ${d.suggest}</button>
    <button data-c="keep" aria-pressed="false">Keep my ${d.owner}</button>
  </div>
  <span class="saved"></span>
</article>`).join("");
  function paint(id) {
    const s = state[id] || {};
    document.getElementById("c-" + id).querySelectorAll("button[data-c]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === s.choice)));
  }
  function tally() {
    const n = items.filter(d => (state[d.id] || {}).choice).length;
    document.getElementById("tally").textContent = `Decided ${n} of ${items.length}`;
    document.getElementById("prog").style.width = (100 * n / items.length) + "%";
  }
  function show(k) {
    cur = Math.max(0, Math.min(items.length - 1, k));
    document.querySelectorAll(".card.current").forEach(c => c.classList.remove("current"));
    document.getElementById("c-" + items[cur].id).classList.add("current");
  }
  function save(id) {
    const s = state[id], d = byId[id], note = document.getElementById("c-" + id).querySelector(".saved");
    const body = { choice: s.choice, final: s.choice === "accept" ? d.suggest : d.owner, owner: d.owner, suggest: d.suggest,
                   updatedAt: new Date().toISOString() };
    if (!db) { try { localStorage.setItem("e3-revise", JSON.stringify(state)); } catch (e) {} note.textContent = "Kept in this browser"; return; }
    note.textContent = "Saving…";
    chains[id] = (chains[id] || Promise.resolve()).then(() => db.collection("revisions").doc(id).set(body))
      .then(() => { note.textContent = "Saved"; }).catch(() => { note.textContent = "Not saved. Try again."; });
  }
  document.getElementById("list").addEventListener("click", e => {
    const b = e.target.closest("button[data-c]"); if (!b) return;
    const id = b.closest(".card").id.slice(2);
    state[id] = { choice: b.dataset.c };
    paint(id); tally(); save(id);
    setTimeout(() => show(cur + 1), 300);
  });
  document.getElementById("back").addEventListener("click", () => show(cur - 1));
  document.getElementById("next").addEventListener("click", () => show(cur + 1));
  tally(); show(0);
  (async () => {
    try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) {
      document.getElementById("offline").hidden = false;
      try { Object.assign(state, JSON.parse(localStorage.getItem("e3-revise") || "{}")); } catch (e) {}
      items.forEach(d => paint(d.id)); tally(); return;
    }
    db.collection("revisions").onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id; if (!byId[id]) return;
        if (ch.type === "removed") delete state[id]; else state[id] = { choice: (ch.doc.data() || {}).choice };
        paint(id);
      });
      tally();
      if (!placed && !snap.metadata.fromCache) {  // resume at the first undecided item once
        placed = true;
        const k = items.findIndex(d => !(state[d.id] || {}).choice);
        show(k < 0 ? items.length - 1 : k);
      }
    }, () => { document.getElementById("offline").hidden = false; });
  })();
})();
</script>
