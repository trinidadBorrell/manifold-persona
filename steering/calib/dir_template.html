<style>
/* Layout: one reading column; sticky controls; each finding = claim, one figure, plain caption. */
:root {
  --bg: #f3f5f4; --panel: #ffffff; --ink: #142021; --ink-2: #48585a; --ink-3: #7b8a8c; --rule: #d9e0df; --grid: #e8edec;
  --accent: #0f7b74; --bad: #c8562a;
  --r-LIN: #6b7f99; --r-PMG: #c8562a; --r-MAN3: #8fbf9f; --r-MAN4: #4f9f6f; --r-MAN5: #2c6e46; --r-FL: #6a4fb3; --r-FG: #0f7b74; --r-PCA: #9a8c4a; --r-start: #8a8f98;
  --display: "Spectral", Georgia, serif; --sans: "Public Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111717; --panel: #182021; --ink: #e7eeed; --ink-2: #aebcbc; --ink-3: #82918f; --rule: #2b3637; --grid: #222c2d; --accent: #3fb3a9; --bad: #ee8a51;
  --r-LIN: #94a7c2; --r-PMG: #ee8a51; --r-MAN3: #a9d8b8; --r-MAN4: #6fc08e; --r-MAN5: #4a9d6b; --r-FL: #a08ae6; --r-FG: #3fb3a9; --r-PCA: #c9b86a; --r-start: #9aa0a9; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111717; --panel: #182021; --ink: #e7eeed; --ink-2: #aebcbc; --ink-3: #82918f; --rule: #2b3637; --grid: #222c2d; --accent: #3fb3a9; --bad: #ee8a51;
  --r-LIN: #94a7c2; --r-PMG: #ee8a51; --r-MAN3: #a9d8b8; --r-MAN4: #6fc08e; --r-MAN5: #4a9d6b; --r-FL: #a08ae6; --r-FG: #3fb3a9; --r-PCA: #c9b86a; --r-start: #9aa0a9; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 18px; padding-block: 32px 72px; display: grid; gap: 30px; }
h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 2.1rem; line-height: 1.12; } h2 { font-size: 1.35rem; line-height: 1.25; }
h3 { margin: 0; font: 600 0.92rem/1.3 var(--sans); }
p { margin: 0; max-width: 70ch; }
.lede { color: var(--ink-2); font-size: 1.05rem; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font: 0.8rem/1.5 var(--mono); color: var(--ink-2); } .facts b { color: var(--ink); font-weight: 500; }
section { display: grid; gap: 12px; min-width: 0; }
.eyebrow { font: 500 0.72rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.claim { font-size: 1.05rem; }
.figure { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px; min-width: 0; }
.chart { width: 100%; height: 300px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .grid3 { grid-template-columns: 1fr; } }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 12px; display: grid; gap: 6px; min-width: 0; font-size: 0.86rem; color: var(--ink-2); }
.card b { color: var(--ink); }
.how { font-size: 0.9rem; color: var(--ink-2); border-left: 2px solid var(--rule); padding-left: 12px; }
.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding-block: 8px; font: 0.78rem var(--mono); color: var(--ink-3); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; }
.seg button { font: 500 0.8rem/1 var(--sans); background: var(--panel); color: var(--ink-2); border: 0; border-right: 1px solid var(--rule); padding: 7px 10px; cursor: pointer; }
.seg button:last-child { border-right: 0; } .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .sw { width: 16px; border-top: 3px solid; }
.tbl { overflow-x: auto; } table { border-collapse: collapse; font: 0.78rem/1.4 var(--mono); font-variant-numeric: tabular-nums; }
th, td { padding: 4px 9px; border-bottom: 1px solid var(--grid); text-align: right; } th:first-child, td:first-child { text-align: left; } th { color: var(--ink-3); font-weight: 500; }
details summary { cursor: pointer; font-weight: 500; }
.err { color: var(--bad); font-family: var(--mono); }
</style>
<div class="wrap">
  <header style="display:grid;gap:12px">
    <span class="eyebrow">E2 · plan 2026-10-09</span>
    <h1>Does the principal geodesic steer behaviour more reliably?</h1>
    <p class="lede" id="lede"></p>
    <div class="facts" id="facts"></div>
  </header>
  <div class="controls"><span>strength</span><span class="seg" id="segA"></span></div>
  <section><span class="eyebrow">The three directions, named before steering</span><div class="cards" id="cards"></div></section>
  <div class="legend" id="legend"></div>

  <section><span class="eyebrow">Finding 1 · does the answer move towards the end we steer to?</span><h2 id="h1"></h2><p class="claim" id="c1"></p>
    <div class="grid3" id="f1"></div><p class="how" id="how1"></p></section>

  <section><span class="eyebrow">Finding 2 · consistency</span><h2 id="h2"></h2><p class="claim" id="c2"></p>
    <div class="figure"><div class="chart" id="f2"></div></div><p class="how" id="how2"></p></section>

  <section><span class="eyebrow">Finding 3 · the written hypothesis</span><h2 id="h3"></h2><p class="claim" id="c3"></p>
    <div class="figure"><div class="chart" id="f3"></div></div><p class="how" id="how3"></p></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.34.0/plotly.min.js"></script>
<script id="data" type="application/json">__DATA__</script>
<script>
window.addEventListener("error", function (e) { var w = document.querySelector(".wrap"), m = document.createElement("p");
  m.className = "err"; m.textContent = "The charts could not be drawn: " + (e.message || "a script failed to load") + "."; if (w) w.insertBefore(m, w.children[1]); }, true);
</script>
<script>
(function () {
  if (typeof Plotly === "undefined") throw new Error("the Plotly chart library did not load");
  const D = JSON.parse(document.getElementById("data").textContent), N = D.notes;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  ["lede", "h1", "c1", "how1", "h2", "c2", "how2", "h3", "c3", "how3"].forEach(k => document.getElementById(k).textContent = N[k] || "");
  document.getElementById("facts").innerHTML = D.facts.map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("");
  const RN = { FG: "Fletcher principal geodesic", FL: "Fletcher straight line", PCA: "PCA straight line" };
  const col = r => css("--r-" + r);
  const dirs = [...new Set(D.lean.map(l => l.direction))].sort();
  document.getElementById("cards").innerHTML = dirs.map(k => { const h = D.hyp[String(k)] || {};
    return `<div class="card"><b>Direction ${k}: ${esc(h.name || "")}</b><div><b>− end:</b> ${esc(h.minus || "")}</div><div><b>+ end:</b> ${esc(h.plus || "")}</div></div>`; }).join("");
  document.getElementById("legend").innerHTML = D.routes.map(r => `<span><span class="sw" style="border-color:${col(r)}"></span>${RN[r]}</span>`).join("") +
    `<span><span class="sw" style="border-color:${css("--bad")};border-top-style:dotted"></span>collapsed (right axis)</span>`;
  const st = { A: "1" };
  const base = extra => Object.assign({ paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)", margin: { l: 48, r: 40, t: 6, b: 44 }, showlegend: false,
    font: { family: css("--sans"), color: css("--ink-2"), size: 11 }, hovermode: "x unified",
    hoverlabel: { bgcolor: css("--panel"), bordercolor: css("--rule"), font: { color: css("--ink"), family: css("--mono"), size: 11 } } }, extra);
  const ax = (t, e) => Object.assign({ title: { text: t, font: { size: 11 } }, gridcolor: css("--grid"), linecolor: css("--rule"), zerolinecolor: css("--rule"), tickfont: { family: css("--mono"), size: 10 } }, e || {});
  function fig1() {
    const el = document.getElementById("f1");
    el.innerHTML = dirs.map(k => `<div class="figure"><h3>Direction ${k}</h3><div class="chart" style="height:250px" id="f1_${k}"></div></div>`).join("");
    dirs.forEach(k => {
      const tr = [];
      D.routes.forEach(r => {
        const rs = D.lean.filter(l => l.view === st.A && l.direction === k && l.route === r).sort((a, b) => a.s - b.s);
        tr.push({ x: rs.map(l => l.s), y: rs.map(l => 100 * l.lean), type: "scatter", mode: "lines+markers", name: RN[r], line: { color: col(r), width: r === "FG" ? 3 : 2 },
          marker: { size: 5 }, hovertemplate: RN[r] + ": %{y:.0f}<extra>step %{x}</extra>" });
        tr.push({ x: rs.map(l => l.s), y: rs.map(l => 100 * l.collapsed), yaxis: "y2", type: "scatter", mode: "lines", name: RN[r] + " collapsed",
          line: { color: col(r), width: 1, dash: "dot" }, hovertemplate: RN[r] + " collapsed: %{y:.0f}%<extra></extra>" });
      });
      Plotly.react("f1_" + k, tr, base({ xaxis: ax("step (− towards − end · + towards + end)", { dtick: 0.5 }),
        yaxis: ax("change in (+ side % − − side %)", { zeroline: true }), yaxis2: ax("collapsed %", { overlaying: "y", side: "right", range: [0, 100], showgrid: false }) }),
        { responsive: true, displaylogo: false });
    });
  }
  function fig2() {
    const tr = D.routes.map(r => { const rs = dirs.map(k => D.cons.find(c => c.view === st.A && c.direction === k && c.route === r) || {});
      return { type: "bar", name: RN[r], x: dirs.map(k => "Direction " + k), y: rs.map(c => c.consistency == null ? null : 100 * c.consistency), marker: { color: col(r) },
        text: rs.map(c => c.n_moved == null ? "" : c.n_moved + "/" + c.n_series + " moved"), textposition: "outside", textfont: { size: 10, family: css("--mono") },
        hovertemplate: RN[r] + ": %{y:.0f}%<extra></extra>" }; });
    Plotly.react("f2", tr, base({ barmode: "group", hovermode: "closest", margin: { l: 50, r: 10, t: 10, b: 40 }, xaxis: ax(""),
      yaxis: ax("Moved series going the expected way (%)", { range: [0, 115] }),
      shapes: [{ type: "line", xref: "paper", x0: 0, x1: 1, y0: 50, y1: 50, line: { color: css("--rule"), dash: "dot" } }] }), { responsive: true, displaylogo: false });
  }
  function fig3() {
    const tr = D.routes.map(r => { const rs = dirs.flatMap(k => [-1, 1].map(e => D.trait.find(t => t.view === st.A && t.direction === k && t.route === r && t.end === e) || {}));
      return { type: "bar", name: RN[r], x: dirs.flatMap(k => ["Dir " + k + " · − end", "Dir " + k + " · + end"]),
        y: rs.map(t => t.expected ? 100 * (t.expected[0] - (t.opposite ? t.opposite[0] : 0)) : null), marker: { color: col(r) },
        hovertemplate: RN[r] + ": %{y:.0f}<extra></extra>" }; });
    Plotly.react("f3", tr, base({ barmode: "group", hovermode: "closest", margin: { l: 50, r: 10, t: 10, b: 60 }, xaxis: ax(""),
      yaxis: ax("expected end % − opposite end % (trait judge)", { zeroline: true }) }), { responsive: true, displaylogo: false });
  }
  function render() {
    const e = document.getElementById("segA");
    e.innerHTML = ["1", "2", "4"].map(v => `<button type="button" data-v="${v}" aria-pressed="${v === st.A}">α = ${v}</button>`).join("");
    e.onclick = ev => { const b = ev.target.closest("button"); if (b) { st.A = b.dataset.v; render(); } };
    fig1(); fig2(); fig3();
  }
  render();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
