[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "manifold-persona"
version = "0.1.0"
requires-python = ">=3.9"
description = "Persona-activation geometry: do character-role representations lie on a low-dimensional manifold, and can we steer along it?"
dependencies = []   # deliberately empty; requirements.txt stays the source of truth

# One package per experiment under src/ (see README.md). Folders without an
# __init__.py (assistant_axis, per_persona_geometry, diagnostics, robustness) are
# script folders run by path, not packages.
[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
